[project]
name = "accountlens-ai-cap931"
version = "1.1.0"
description = "Multi-agent GPT sales intelligence prototype for CAP 931"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "openai>=1.101,<3",
    "pydantic>=2.8,<3",
    "pypdf>=5.1,<7",
    "python-docx>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "streamlit>=1.37,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
