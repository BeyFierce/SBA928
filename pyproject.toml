[project]
name = "sba928-market-research"
version = "1.0.0"
description = "Reproducible prompt-engineering, FLAN-T5 fine-tuning, comparison, and bias-analysis project"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "accelerate>=1.2,<2",
  "datasets>=3.2,<5",
  "pandas>=2.2,<3",
  "protobuf>=5,<7",
  "sentencepiece>=0.2,<0.3",
  "torch>=2.4,<3",
  "transformers>=4.57.6,<5",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
